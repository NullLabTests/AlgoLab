# AlgoLab default configuration (M1).
# Monetary limits override compute-credit limits (MASTER_SPEC.md §2).
storage:
  path: data/algolab.sqlite3
  # Relative paths are resolved against the working directory at CLI startup.
  artifacts_dir: artifacts
budget:
  weekly_credits: 100.0
  lifetime_cap_credits: 5000.0
  max_run_credits: 200.0
  max_cost: 500.0
  currency: USD
execution:
  # Workload executed by workers (see docs/WORKLOAD_ADAPTERS.md).
  workload: quadratic_optimizer
  # Max attempts per run, including requeues from recovery.
  max_attempts: 2
  # Claim lease duration in seconds; heartbeats extend it.
  lease_seconds: 60.0
  # Worker heartbeat interval in seconds (must be < lease_seconds).
  heartbeat_interval_seconds: 10.0
  # Ceiling for any workload's timeout.
  default_timeout_seconds: 120.0
  # Capture limits (bytes); violations fail the run.
  max_stdout_bytes: 1048576
  max_stderr_bytes: 1048576
  max_artifact_bytes: 10485760
  # Environment keys passed through to workload subprocesses.
  env_allowlist: [PATH, PYTHONPATH, LANG, LC_ALL, TMPDIR, TZ]
  # Default priority for new runs (higher claims first).
  priority_default: 0
recovery:
  # Backoff before a requeued attempt becomes eligible (seconds).
  requeue_backoff_seconds: 5.0
producer: algolab
