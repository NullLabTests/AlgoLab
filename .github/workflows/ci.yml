name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: implementation/algolab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Typecheck (mypy)
        run: mypy
      - name: Test (pytest, fast lane)
        run: pytest -q -m "not slow"

  # Byte-exact reproduction of protocol-240-v1 is environment-sensitive: its
  # raw streams depend on NumPy/scikit-learn versions, and NumPy 2.5.2 requires
  # Python >=3.12. The matrix above still tests Python 3.11/3.12 compatibility;
  # this dedicated job pins the sealed bundle's numerical environment so the
  # reproduction test actually runs and is not silently skipped.
  repro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/algolab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned reproduction environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" numpy==2.5.2 scikit-learn==1.9.0
      - name: Verify committed protocol-240 bundle reproduces
        run: >-
          pytest -q
          tests/test_protocol_240.py::TestCommittedBundleReproduces::test_committed_bundle_reproduces_in_a_clean_process

  # Full suite, including any @slow tests. Currently none are marked slow, so
  # this matches the fast lane; it exists so the marker lane stays wired.
  full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation/algolab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (pytest, full)
        run: pytest -q
